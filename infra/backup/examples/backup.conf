# /etc/homelab-backup/backup.conf — qué se copia y cuánto se guarda.
# Es un fichero de bash: VARIABLE="valor".

# Qué copiar. /opt tiene los datos y los compose; /etc la configuración del sistema.
BACKUP_PATHS="/opt /etc"

# Qué no copiar (patrones de restic). /opt/backups es donde el OTRO mini PC guarda
# su copia en esta máquina: no tiene sentido copiarla otra vez.
BACKUP_EXCLUDES="/opt/backups /opt/**/cache /opt/**/*.tmp /opt/**/logs"

# Bases de datos SQLite que se vuelcan en caliente antes de copiar (sin parar servicios).
# Ejemplos típicos; ajusta las rutas a las tuyas.
SQLITE_DBS="/opt/uptime-kuma/data/kuma.db /opt/grafana/data/grafana.db"

# Retención: 7 diarias, 4 semanales y 1 mensual
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=1

# Verificación semanal: % de los datos que se leen y validan de verdad en cada destino
VERIFY_READ_SUBSET=5%

# Monitor Push de Uptime Kuma para la verificación: usa la IP (no un nombre que dependa de tu DNS)
# y entre comillas. La parte ?status=... sobra; si la pegas, se ignora.
VERIFY_PUSH_URL="http://192.168.0.20:3001/api/push/TOKEN-VERIFICACION"
