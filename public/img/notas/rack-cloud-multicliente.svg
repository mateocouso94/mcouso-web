<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1006" font-family="IBM Plex Sans, system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Alzado de un rack de cloud multi-cliente</title><desc id="d">Rack de 48U visto de frente. De arriba abajo: dos firewalls en alta disponibilidad, dos switches de gestión, dos switches de red de clientes, cinco U de reserva, dos cabinas de almacenamiento all-flash de 3U, cinco switches de 100G, diecinueve U de reserva tapadas con paneles ciegos y tres hosts ESXi abajo. A los lados, dos PDU independientes A y B.</desc>
